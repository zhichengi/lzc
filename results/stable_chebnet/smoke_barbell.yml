# ChebNet 烟雾配置。不改官方 configs/。数字不对论文主表（主表是 Peptides）。
exp:
  exp_name: ['barbell_smoke']
  wandb: [False]
  num_seeds: [1]
  start_seed: [0]
  device: [0]
  seed: [58]
data:
  dataset: ['barbell']
  samples: [16]
  task_type: ['mse_regression']
  eval_metric: ['mse']
  minimize: [True]
  num_nodes: [20]
model:
  model_name: ['modelnode']
  layer_type: ['Cheb']
  input_dim: [1]
  hidden_dim: [32]
  out_dim: [1]
  num_layers: [2]
  act: ['relu']
  k: [4]
  step: [0.2]
optim:
  lr: [0.001]
  lr_scheduler: ['ReduceLROnPlateau']
  early_stop: [False]
  epochs: [2]
  batch_size: [8]
